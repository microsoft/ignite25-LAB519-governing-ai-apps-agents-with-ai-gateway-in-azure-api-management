# GitHub Actions Workflow: Add Issues to Ignite Project
# 
# This workflow automatically:
# 1. Adds new issues to the specified Ignite GitHub Project
# 2. Applies appropriate labels based on issue content
#
# Setup required:
# - Update project-url with the actual Ignite project number
# - Ensure GITHUB_TOKEN has appropriate permissions for project and issues
#
name: Add Issues to Ignite Project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    name: Add issue to Ignite GitHub Project
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/microsoft/projects/IGNITE_PROJECT_NUMBER
          github-token: ${{ secrets.GITHUB_TOKEN }}

  label_issues:
    name: Apply labels to new issues
    runs-on: ubuntu-latest
    steps:
      - name: Label issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = [];
            
            // Add default label for new issues
            labels.push('triage');
            
            // Add label based on issue title patterns
            const title = issue.title.toLowerCase();
            if (title.includes('bug') || title.includes('error') || title.includes('broken')) {
              labels.push('bug');
            } else if (title.includes('feature') || title.includes('enhancement')) {
              labels.push('enhancement');
            } else if (title.includes('question') || title.includes('help')) {
              labels.push('question');
            }
            
            // Add labels to the issue
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }